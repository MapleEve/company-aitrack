name: Claude Code Review

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
  GH_TOKEN_VALUE: ${{ secrets.GH_TOKEN }}
  CLAUDE_MODEL: claude-sonnet-4-6

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    name: Claude AI Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Skip when Claude secrets are not configured
        if: ${{ env.ANTHROPIC_API_KEY == '' || env.ANTHROPIC_BASE_URL == '' || env.GH_TOKEN_VALUE == '' }}
        run: echo "Claude review secrets not configured; skipping."

      - name: Checkout repository
        if: ${{ env.ANTHROPIC_API_KEY != '' && env.ANTHROPIC_BASE_URL != '' && env.GH_TOKEN_VALUE != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Claude Code Review
        if: ${{ env.ANTHROPIC_API_KEY != '' && env.ANTHROPIC_BASE_URL != '' && env.GH_TOKEN_VALUE != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}
          model: ${{ env.CLAUDE_MODEL }}
          allowed_tools: "Bash(cargo check *),Bash(cargo clippy *),Bash(cargo test *),Bash(git diff *),Bash(git status *)"
          custom_instructions: |
            You are reviewing company-aitrack, a Rust CLI client + Java/Go server stack for tracking AI coding usage.
            The Rust client (client/) uses clap, rusqlite, reqwest (rustls-tls), ed25519-dalek, sqlite-vec.
            The server has two implementations: server-java (Spring Boot) and server-go (chi).
            Watch for: leaked signing keys or secrets, unsafe unwrap()/expect() in production paths,
            missing #[cfg(unix)] guards on Unix-specific code, SQL injection in raw queries,
            breaking changes to the CLIENT ↔ SERVER JSON contract (defined in CONTRACT.md).
            Treat missing error handling, broken cross-platform compat, and contract regressions as high-signal.
          prompt: |
            Review this aitrack pull request and focus on:
            - Rust safety: unwrap/expect in non-test code, error propagation, cross-platform cfg guards
            - Contract compatibility: does this change break CLIENT↔SERVER JSON schema (CONTRACT.md)?
            - Security: no signing keys, no secrets, no internal identifiers in public-facing code
            - CI correctness: workflow changes that could break builds or skip required checks

            Prefer concrete file/line findings over broad summaries.
