name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    name: Claude AI Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking: requires Claude Code GitHub App installation + custom
    # ANTHROPIC_BASE_URL supporting app-token auth. Not a required check.
    # Remove continue-on-error once the GitHub App is installed on this repo.
    continue-on-error: true
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Skip if API key not configured
        id: check-key
        env:
          _KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret not set — Claude review skipped. Set the secret to enable AI code review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude Code Review
        if: steps.check-key.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: "true"
          use_sticky_comment: "true"
          claude_args: "--model claude-sonnet-4-5"
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
