name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write

jobs:
  review:
    name: claude-code-review
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      CLAUDE_MODEL: claude-sonnet-4-6
    steps:
      - name: Skip when Claude secrets are not configured
        if: ${{ env.ANTHROPIC_API_KEY == '' || env.ANTHROPIC_BASE_URL == '' }}
        run: echo "Claude Code review secrets are not configured; skipping Claude Code review."

      - name: Checkout repository
        if: ${{ env.ANTHROPIC_API_KEY != '' && env.ANTHROPIC_BASE_URL != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code review
        if: ${{ env.ANTHROPIC_API_KEY != '' && env.ANTHROPIC_BASE_URL != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          use_sticky_comment: true
          exclude_comments_by_actor: MapleEve,github-actions,codecov
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this aitrack pull request. aitrack is a Rust CLI client + Java/Go server stack
            for tracking AI coding usage (CONTRACT.md is the wire protocol SSoT).

            Focus on actionable risks:
            - Rust safety: unwrap/expect in non-test paths, error propagation, cross-platform cfg guards
            - Contract compatibility: does this break CLIENT↔SERVER JSON schema (CONTRACT.md)?
            - Security: no signing keys, no secrets, no internal identifiers in public code
            - Three-way sync: protocol changes must appear in client/, server-java/, server-go/ simultaneously
            - CI correctness: workflow changes that break builds or skip required checks

            The PR branch is already checked out in the current working directory.
            Post feedback only through the official Claude Code Action GitHub integration.
            Do not use the GitHub CLI and do not use a user-owned GitHub token.
            If there are no actionable findings, post the standard no-findings confirmation.
            Avoid formatting-only comments.

          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 60
