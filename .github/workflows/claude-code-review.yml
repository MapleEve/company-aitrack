name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    name: Claude AI Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.changed_files, 'claude-code-review.yml')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Skip if API key not configured
        id: check-key
        env:
          _KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret not set — Claude review skipped. Set the secret to enable AI code review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude Code Review
        if: steps.check-key.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-5
          track_progress: "true"
          use_sticky_comment: "true"
          allowed_tools: |
            Bash(cargo fmt --manifest-path client/Cargo.toml -- --check)
            Bash(cargo clippy --manifest-path client/Cargo.toml -- -D warnings)
            Bash(cd server-go && go vet ./...)
            Bash(cd server-go && go build ./...)
            Bash(cd server-java && mvn verify -q -pl .)
            Bash(rg:*)
            Bash(git diff:*)
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
